# render.yaml - Render.com deployment configuration
# Deploy by connecting your GitHub repo to Render

services:
  - type: web
    name: vgc-mcp
    runtime: python
    plan: free
    branch: main
    buildCommand: python -m pip install -e ".[remote]"
    startCommand: vgc-mcp-http
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
    # Deploy only after GitHub CI succeeds on main. `autoDeployTrigger`
    # replaces Render's deprecated `autoDeploy` field.
    autoDeployTrigger: checksPass
