[project]
name = "vgc-mcp"
version = "1.0.0"
description = "VGC Pokemon Team Builder MCP Server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # <2.0: mcp 2.0.0 (2026-07-28) removed mcp.server.fastmcp, which the whole
    # server is built on. Raising this bound is a migration, not a bump.
    "mcp>=1.0.0,<2.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "diskcache>=5.6.0",
    "openpyxl>=3.1.0",
    "fpdf2>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "types-openpyxl>=3.1.0",
]
remote = [
    "uvicorn>=0.30.0",
    "starlette>=0.38.0",
]

[project.scripts]
vgc-mcp = "vgc_mcp.server:main"
vgc-mcp-http = "vgc_mcp.server:main_http"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vgc_mcp_core", "src/vgc_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Integration tests (live PokeAPI/Smogon) are excluded by default so the gate
# never depends on external services. Run them explicitly with `-m integration`.
addopts = "-m 'not integration'"
markers = [
    "integration: tests that hit real network/API endpoints (skipped by default in CI)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
# E501: the codebase renders wide markdown tables and long f-string rows in
# tool output; wrapping them hurts readability.
# N806: function-local lookup tables are deliberately UPPER_CASE
# (NATURE_MAP, SPEED_STAGE_MULTIPLIERS, ...) — they are constants in spirit.
# Everything else is enforced.
ignore = ["E501", "N806"]

[tool.ruff.lint.per-file-ignores]
# __init__.py imports are intentional re-exports (public API surface).
"**/__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
strict = true
