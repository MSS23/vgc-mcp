version: 2

updates:
  # Python dependencies declared in pyproject.toml. Security patches for the
  # runtime deps (mcp, httpx, pydantic, diskcache, openpyxl, fpdf2) are the
  # reason this exists — CI has no other CVE signal.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # One PR for the dev toolchain instead of five — pytest/ruff/mypy bumps
      # are low-risk and reviewing them separately is pure noise.
      dev-tooling:
        patterns:
          - pytest*
          - ruff
          - mypy
    ignore:
      # mcp 2.0 removed mcp.server.fastmcp, which the server is built on.
      # Moving to 2.x is a migration (see the bound in pyproject.toml), so
      # skip major bumps; minor and patch releases of 1.x still come through.
      - dependency-name: mcp
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps"

  # Action versions pinned in .github/workflows/*.yml. These go stale silently
  # and eventually break when GitHub retires a runner image or node version.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
