name: Keep Render dyno warm

# Render's free tier spins the service down after 15 minutes without traffic.
# Waking it takes 20-60 s, which breaks the Claude connector handshake and
# makes the first reply on a phone look broken. This workflow keeps the free
# instance awake without a paid plan or any outside account.
#
# How it stays continuous even though GitHub delays scheduled runs:
# - GitHub fires high-frequency crons late (observed: every 4-6 hours).
# - So each run does not ping once. It pings every 10 minutes for ~5h50m,
#   just under the 6-hour job limit.
# - The concurrency group keeps exactly one run active and one queued. When
#   the active run ends, the queued run starts at once and carries on.
# - Net effect: one ping every 10 minutes around the clock, which is inside
#   Render's 15-minute idle window.
#
# Budget: one free Render service awake all month is ~744 instance-hours,
# inside the 750-hour free allowance (keep only ONE free service on the
# account). Actions minutes are free for public repositories.
#
# GitHub disables scheduled workflows after 60 days with no repository
# activity. If that ever happens, re-enable "Keep Render dyno warm" in the
# Actions tab, or add an external 5-minute monitor (UptimeRobot, cron-job.org)
# on https://vgc-mcp.onrender.com/health as a second pinger.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

# One run pings, one waits. A newer queued run replaces an older queued one,
# and nothing is cancelled mid-loop.
concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Ping /health every 10 minutes for ~5h50m
        env:
          URL: https://vgc-mcp.onrender.com/health
          INTERVAL_SECONDS: "600"
          WINDOW_SECONDS: "20700" # 5h45m; leaves room for the last ping before the 355-min timeout
        run: |
          set -u
          start=$(date +%s)
          pings=0
          successes=0
          slowest=0
          while :; do
            pings=$((pings + 1))
            ok=0
            for attempt in 1 2 3; do
              if out=$(curl -fsS --max-time 90 -o /dev/null -w "%{http_code} %{time_total}" "$URL"); then
                secs=${out#* }
                echo "ping $pings: HTTP ${out% *} in ${secs}s"
                secs_int=${secs%.*}
                [ "$secs_int" -gt "$slowest" ] && slowest=$secs_int
                ok=1
                break
              fi
              echo "ping $pings attempt $attempt failed; retrying in $((attempt * 10))s"
              sleep $((attempt * 10))
            done
            successes=$((successes + ok))
            elapsed=$(( $(date +%s) - start ))
            [ $((elapsed + INTERVAL_SECONDS)) -ge "$WINDOW_SECONDS" ] && break
            sleep "$INTERVAL_SECONDS"
          done
          {
            echo "### Keep-alive window"
            echo "| Pings | Succeeded | Slowest response |"
            echo "|---|---|---|"
            echo "| $pings | $successes | ${slowest}s |"
          } >> "$GITHUB_STEP_SUMMARY"
          # A slow first ping means the dyno had already fallen asleep before
          # this run started; that is expected right after a gap, not a failure.
          [ "$successes" -gt 0 ] || exit 1
