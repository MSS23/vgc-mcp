name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Project uses 3.12+ f-string syntax in some tool files; pin matrix to
        # 3.12 and 3.13 until that is cleaned up. pyproject.toml's
        # requires-python should be raised to >=3.12 to match.
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-asyncio ruff

      - name: Run tests
        # Tests are the actual gate — 1100+ across mainline + champions.
        run: python -m pytest tests/ -q --tb=short

      - name: Lint with ruff (advisory)
        # Ruff is informational while the historical codebase is cleaned up.
        # Use --exit-zero so findings show in logs but don't block PRs.
        # Switch to a hard gate once the backlog is below ~50 issues.
        run: python -m ruff check src/ --exit-zero --output-format=github

      - name: Lint changed files (strict)
        # Hard gate on files touched in this PR — prevents regressions
        # without forcing a full-codebase cleanup up front.
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          CHANGED=$(git diff --name-only --diff-filter=AM origin/${{ github.base_ref }}...HEAD -- 'src/**/*.py' || true)
          if [ -n "$CHANGED" ]; then
            echo "Linting changed files:"
            echo "$CHANGED"
            python -m ruff check $CHANGED
          else
            echo "No changed Python files in src/."
          fi

  validate-regulations:
    name: Validate regulations.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-asyncio jsonschema

      - name: Schema + drift check
        # Strict gate on the JSON schema and router-alias drift.
        # Fails non-zero if any invariant is violated.
        run: python scripts/validate_regulations.py

      - name: Run regulation consistency tests
        # These guard against drift between regulations.json and the router's
        # alias map — silent UX bugs if they go out of sync.
        run: python -m pytest tests/champions/test_alias_consistency.py tests/champions/test_regulation.py -v
