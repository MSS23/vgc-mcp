name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: no job here writes to the repo. Render deploys via its own
# GitHub App (see render.yaml), not via a token from this workflow.
permissions:
  contents: read

# Superseded PR pushes are pointless work — cancel them. main is NEVER
# cancelled: Render's `autoDeployTrigger: checksPass` waits for a completed
# successful CI run on the commit, and a cancelled run would strand the deploy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Full range of pyproject.toml's requires-python (>=3.11). The 3.12+
        # f-string nesting that used to break 3.11 was fixed, and the full
        # suite passes on 3.11.
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev deps
        # Install via the declared [dev] extra (pinned toolchain: pytest,
        # pytest-cov, ruff, mypy) instead of an ad-hoc list, so CI uses the
        # same tools declared in pyproject.toml.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        # Tests are the actual gate — 1100+ across mainline + champions.
        # Integration tests are excluded via addopts (-m 'not integration').
        # Coverage is measured but not yet gated on a floor.
        run: python -m pytest tests/ -q --tb=short --cov=vgc_mcp --cov=vgc_mcp_core --cov-report=term-missing

      - name: Lint with ruff (strict)
        # The historical backlog was cleaned up (was ~1,900 findings);
        # ruff is now a hard gate on the whole codebase.
        run: >-
          python -m ruff check src/ tests/ scripts/verify_production.py
          --output-format=github

  typecheck:
    name: Type check (mypy strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: mypy (strict, ratcheting)
        # mypy strict is configured in pyproject.toml. A full clean-up is ~1300
        # findings (mostly bare dict/list annotations), so instead of an
        # unenforced continue-on-error this is a ratchet: the count may only go
        # down. Lower MYPY_BASELINE whenever you burn some down; when it hits 0,
        # replace this whole step with a plain `python -m mypy ...`.
        env:
          MYPY_BASELINE: "1301"
        run: |
          count=$(python -m mypy src/vgc_mcp_core src/vgc_mcp 2>&1 | tee /dev/stderr \
            | grep -cE '^.+: error: ' || true)
          echo "mypy errors: $count (baseline $MYPY_BASELINE)"
          if [ "$count" -gt "$MYPY_BASELINE" ]; then
            echo "::error::mypy errors increased: $count > $MYPY_BASELINE. Fix the new findings."
            exit 1
          fi
          if [ "$count" -lt "$MYPY_BASELINE" ]; then
            echo "::notice::mypy errors dropped to $count — lower MYPY_BASELINE in ci.yml."
          fi

  catalog-drift:
    name: Tool catalog drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[remote]"

      - name: Regenerate catalog and check for drift
        # The tools catalog is generated from the live server. If adding a tool
        # without regenerating the catalog, this fails so the docs can't rot.
        run: |
          python scripts/build_catalog.py
          git diff --exit-code docs/tools-catalog.md || {
            echo "::error::docs/tools-catalog.md is stale. Run scripts/build_catalog.py and commit the result.";
            exit 1;
          }

  validate-regulations:
    name: Validate regulations.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install jsonschema

      - name: Schema + drift check
        # Strict gate on the JSON schema and router-alias drift.
        # Fails non-zero if any invariant is violated.
        run: python scripts/validate_regulations.py

      - name: Run regulation consistency tests
        # These guard against drift between regulations.json and the router's
        # alias map — silent UX bugs if they go out of sync.
        run: python -m pytest tests/champions/test_alias_consistency.py tests/champions/test_regulation.py -v

  docker:
    name: Docker image builds and serves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        # Dockerfile is a documented deploy path (docs/deploy.md: Docker and
        # Fly.io, which builds from it via fly.toml). Nothing else in CI
        # exercised it, so a broken Dockerfile only surfaced at deploy time.
        run: docker build -t vgc-mcp:ci .

      - name: Boot the container and hit /health
        # Building proves it compiles; this proves the image actually serves.
        # Same endpoint Render, Fly and keep-alive.yml use.
        run: |
          docker run -d --name vgc-mcp-ci -p 8000:8000 vgc-mcp:ci
          for i in $(seq 1 30); do
            if curl -fsS --max-time 5 http://localhost:8000/health; then
              echo "healthy after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::container failed /health within 30s"
          docker logs vgc-mcp-ci
          exit 1

      - name: Tear down
        if: always()
        run: docker rm -f vgc-mcp-ci || true
