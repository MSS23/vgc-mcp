# Smithery MCP server manifest — https://smithery.ai
# Lets vgc-mcp be discovered and one-click-installed by MCP-compatible clients.
name: vgc-mcp
displayName: VGC Pokémon Coach
description: >
  Pokémon VGC team-building and live battle coaching over MCP, for mainline
  VGC and Pokémon Champions. 34 core tools by default (all 206 at /mcp/full)
  for Showdown-accurate damage calcs, multi-threat spread optimization,
  replay analysis and a turn-by-turn battle copilot. Plug into Claude,
  ChatGPT, or any MCP client.
homepage: https://github.com/MSS23/vgc-mcp
repository: https://github.com/MSS23/vgc-mcp
license: MIT

categories:
  - games
  - data-analysis
  - assistant

keywords:
  - pokemon
  - vgc
  - damage-calculator
  - showdown
  - team-builder
  - smogon
  - competitive
  - battle-coach
  - replay-analysis

# Hosted endpoint — modern Streamable HTTP transport at /mcp (core profile,
# what current Claude.ai connectors and MCP clients expect). /mcp/full serves
# every tool. Legacy SSE remains served at /sse for older clients.
remote:
  type: streamable-http
  url: https://vgc-mcp.onrender.com/mcp
  health: https://vgc-mcp.onrender.com/health

# Local install option for Claude Desktop
local:
  command: vgc-mcp
  install:
    - "pip install git+https://github.com/MSS23/vgc-mcp.git"
  python: ">=3.11"

# Tools served at the remote URL above (the core profile) + highlights.
tools:
  count: 34
  total_at_full_endpoint: 206
  highlights:
    - calculate_damage_output
    - calc_damage_vs_smogon_sets
    - find_survival_evs
    - optimize_multi_survival_spread
    - analyze_outspeed_probability
    - prepare_team
    - start_battle
    - suggest_next_move
    - analyze_replay
    - export_damage_report

prompts:
  - id: check_damage
    label: "Check if a Pokémon can KO another"
  - id: build_team
    label: "Help me build a VGC team"
  - id: analyze_paste
    label: "Analyze a Showdown team paste"
  - id: optimize_spread
    label: "Optimize a Pokémon's EV spread"
  - id: find_survival_spread
    label: "Find EVs to survive a specific attack"
  - id: prepare_for_tournament
    label: "Get a team ready for a Regional"
  - id: explain_replay
    label: "Explain what happened in a Showdown replay"
