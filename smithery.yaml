# Smithery MCP server manifest — https://smithery.ai
# Lets vgc-mcp be discovered and one-click-installed by MCP-compatible clients.
name: vgc-mcp
displayName: VGC Pokémon Coach
description: >
  Pokémon VGC team-building and live battle coaching over MCP. 208 tools for
  Showdown-accurate damage calcs, multi-threat EV optimization, replay
  analysis, breakpoint finding, and turn-by-turn battle copilot. Plug into
  Claude Desktop, ChatGPT, or any MCP client.
homepage: https://github.com/MSS23/vgc-mcp
repository: https://github.com/MSS23/vgc-mcp
license: MIT
icon: https://raw.githubusercontent.com/MSS23/vgc-mcp/main/docs/assets/icon.png

categories:
  - games
  - data-analysis
  - assistant

keywords:
  - pokemon
  - vgc
  - damage-calculator
  - showdown
  - team-builder
  - smogon
  - competitive
  - battle-coach
  - replay-analysis

# Hosted endpoint — modern Streamable HTTP transport at /mcp (what current
# Claude.ai connectors and MCP clients expect). Legacy SSE remains served at
# /sse for older clients / the mcp-remote bridge.
remote:
  type: streamable-http
  url: https://vgc-mcp.onrender.com/mcp
  health: https://vgc-mcp.onrender.com/health

# Local install option for Claude Desktop
local:
  command: vgc-mcp
  install:
    - "pip install git+https://github.com/MSS23/vgc-mcp.git"
  python: ">=3.11"

# Tool count + categories for discovery
tools:
  count: 208
  highlights:
    - calculate_damage_output
    - find_survival_evs
    - optimize_multi_survival_spread
    - find_breakpoint
    - start_battle
    - record_turn
    - suggest_next_move
    - analyze_replay
    - compare_build_changes
    - classify_team_archetype

prompts:
  - id: check_damage
    label: "Check if a Pokémon can KO another"
  - id: build_team
    label: "Help me build a VGC team"
  - id: analyze_paste
    label: "Analyze a Showdown team paste"
  - id: optimize_spread
    label: "Optimize a Pokémon's EV spread"
  - id: find_survival_spread
    label: "Find EVs to survive a specific attack"
